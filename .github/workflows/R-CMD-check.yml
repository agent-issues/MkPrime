on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 4'  # Thursdays, 4am
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "Meta**"
      - "docs**"
      - "**.git"
      - "**.json"
      - "**.md"
      - "**.yaml"
      - "**.yml"
      - "!**R-CMD-check.yml"
      - "**.R[dD]ata"
      - "**.Rpro*"
  # Deliberately unfiltered, as in ASan.yml: `changes` applies the `push`
  # filter above, and `gate` reports on every pull request, so a PR touching
  # no package files is not left waiting on checks that never start.
  pull_request:
    branches: ["*"]

name: R-CMD-check

jobs:
  changes:
    name: detect package changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} -> running R CMD check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true
          # Three dots: diff against the merge base; see memcheck.yml.
          changed=$(git diff --name-only "$base...$head")
          echo "Changed files:"
          printf '  %s\n' $changed

          # Mirrors the `push` paths-ignore list, including its exception for
          # this workflow's own file.
          relevant=$(printf '%s\n' "$changed" |
            grep -vE '^(Meta|docs)|\.git$|\.json$|\.md$|\.ya?ml$|\.R[dD]ata$|\.Rpro' || true)
          if printf '%s\n' "$changed" | grep -q 'R-CMD-check\.yml$'; then
            relevant="$relevant R-CMD-check.yml"
          fi
          if [ -n "$(printf '%s' "$relevant" | tr -d '[:space:]')" ]; then
            echo "-> package files changed; running R CMD check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no package files changed; skipping R CMD check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check-release:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    name: ubuntu-24.04 (release)

    env:
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_FORCE_SUGGESTS_: false
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Temporarily bump package version
        run: |
          old_version=$(grep "Version:" DESCRIPTION | awk '{print $2}')
          if [[ $(echo "$old_version" | tr -cd '.' | wc -c) -eq 2 ]]; then
            new_version="${old_version}.8888"
            sed -i "s/Version: .*/Version: ${new_version}/" DESCRIPTION
          fi
        shell: bash

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ runner.arch }}
          needs: |
            check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2


  check-all:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest,   r: "release"}
          - {os: macos-15-intel,   r: "release"} # Until Intel architecture retired 2027-11
          - {os: macOS-latest,     r: "release"}
          # Tests run under covr in the `coverage` job, on this same platform.
          - {os: ubuntu-24.04-arm, r: "release", rspm: "https://packagemanager.posit.co/cran/__linux__/noble/latest", skip-tests: true}
          - {os: ubuntu-24.04,     r: "devel",   rspm: "https://packagemanager.posit.co/cran/__linux__/noble/latest"}

    env:
      _R_CHECK_CRAN_INCOMING_: ${{ github.event_name == 'pull_request' }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_CRAN_INCOMING_USE_ASPELL_: false
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Temporarily bump package version
        run: |
          old_version=$(grep "Version:" DESCRIPTION | awk '{print $2}')
          if [[ $(echo "$old_version" | tr -cd '.' | wc -c) -eq 2 ]]; then
            new_version="${old_version}.9999"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sed -i "" "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            else
              sed -i "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            fi
          fi
          echo "Current package version is now: $(grep "Version:" DESCRIPTION | awk '{print $2}')"
        shell: bash

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Add Quarto to PATH (Windows / Scoop)
        # quarto-dev/quarto-actions#59: Scoop installs quarto but doesn't
        # add its shims dir to GITHUB_PATH, so quarto.exe is invisible to
        # R CMD check. Prepend the shims directory explicitly.
        if: runner.os == 'Windows'
        run: echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install texlive-latex-base texlive-fonts-recommended

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 4-${{ runner.arch }}
          needs: |
            check

      - name: Rebuild TreeDist from source (macOS)
        # P3M's macOS TreeDist 2.15.0 binary calls OpenMP without linking
        # libomp (`symbol not found '___kmpc_dispatch_init_4'`). CRAN's binary
        # is sound but zstd-compressed, which pak cannot extract. macOS R sets
        # SHLIB_OPENMP_CXXFLAGS empty, so a local build has no OpenMP.
        if: runner.os == 'macOS'
        run: install.packages("TreeDist", type = "source", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Pre-install package for Quarto vignette subprocess
        # Quarto spawns a fresh R process when rendering .qmd vignettes; that
        # subprocess uses R_LIBS_USER, not the R CMD check temp library.
        # Pre-installing here ensures library("MkPrime") succeeds on all OSes.
        if: runner.os == 'Windows'
        run: R CMD INSTALL --no-multiarch .
        shell: bash

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.skip-tests && 'c("--no-manual", "--as-cran", "--no-tests")' || 'c("--no-manual", "--as-cran")' }}

  coverage:
    # Its own job, on the cheapest runner. covr must compile its own
    # instrumented build, so it cannot share an install with R CMD check; it
    # runs the full test suite, which is why the arm check leg skips tests.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    name: coverage

    env:
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1-${{ runner.arch }}
          needs: |
            coverage

      - name: Code coverage
        # quiet = FALSE streams the instrumented test run to the job log. The
        # default swallows it, so a test that fails only under covr reports as
        # `Error: Failure in <tempdir>/testthat.Rout.fail` — a path that no
        # longer exists by the time anyone reads the log. The per-file summary
        # and line tally keep the result readable if the upload fails.
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          saveRDS(covr::tally_coverage(cov, by = "line"), "coverage-lines.rds")
          covr::codecov(coverage = cov)
        shell: Rscript {0}

      - name: Upload line coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lines
          path: coverage-lines.rds
          retention-days: 14

  gate:
    # The job branch protection should require, in place of the per-OS
    # checks: a matrix leg skipped by `if:` reports under its unexpanded name,
    # so it could never satisfy a per-OS required check.
    #
    # Certifies exactly the legs that were required before the gate existed,
    # plus `coverage`, which runs the arm leg's tests; macos-15-intel, the arm
    # check and devel stay advisory. `needs` gives only the
    # matrix's aggregate result, so each leg is read from the API.
    name: R-CMD-check gate
    needs: [changes, check-release, check-all, coverage]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Certify R CMD check status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          set -euo pipefail
          echo "changes : ${{ needs.changes.result }} (run=${{ needs.changes.outputs.run }})"

          # Failing to work out whether R CMD check was needed is not a pass.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection did not succeed, so R CMD check status cannot be certified."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.run }}" != "true" ]; then
            echo "No package files changed in this pull request, so R CMD check was not required."
            echo "It still runs on the push to main and in the weekly sweep."
            exit 0
          fi

          fail=0
          echo "coverage : ${{ needs.coverage.result }}"
          [ "${{ needs.coverage.result }}" = "success" ] || fail=1
          for leg in "ubuntu-24.04 (release)" "windows-latest (release)" "macOS-latest (release)"; do
            result=$(gh api --paginate "$JOBS_URL" \
              -q ".jobs[] | select(.name == \"$leg\") | .conclusion")
            echo "$leg : ${result:-missing}"
            [ "$result" = "success" ] || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::A required R CMD check leg did not succeed."
            exit 1
          fi
