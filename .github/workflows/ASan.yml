# Address Sanitizer: Replicate CRAN's gcc-ASAN 'Additional Test'
#
# Structure: `changes` decides whether this PR touches compiled code; `asan`
# runs only if it does; `gate` always runs and reports the single status that
# branch protection requires. A PR with no C++ change skips the ~40-minute
# matrix and the gate passes immediately, so the required check can never
# deadlock on a workflow that did not trigger.
on:
  workflow_dispatch:
  schedule:
    # Weekly full sweep. PRs that touch only tests or vignettes skip the
    # matrix, so this is what eventually exercises a new test against
    # unchanged C++. Offset from mem-check (Sun 06:00) and R-CMD-check
    # (Thu 04:00) so the three do not contend for runners.
    - cron: '0 3 * * 0'  # Sundays, 3am
  push:
    branches:
      - main
      - master
      # No '**asan**' branch pattern: such a branch's push run posts a second
      # `ASAN gate` on the PR's head commit, pending until the full matrix
      # finishes and failed if cancelled. Dispatch on the branch instead.
  # Deliberately unfiltered: the gate job must report on every pull request,
  # or a required check would sit forever at "Expected — waiting for status".
  # Path filtering happens in `changes` instead, where a skip still reports.
  pull_request:

name: gcc-ASAN

jobs:
  changes:
    name: detect compiled-code changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail

          # Anything that is not a pull request (push to main, weekly cron,
          # manual dispatch) always runs the full matrix.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} -> running AddressSanitizer."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true

          # Three dots: diff against the MERGE BASE, not the tip of the
          # base branch. Two dots would attribute every change made on
          # main since this branch forked to this pull request, firing
          # the sanitiser on PRs that touch no compiled code at all.
          changed=$(git diff --name-only "$base...$head")
          echo "Changed files:"
          printf '  %s\n' $changed

          # This workflow's own file is deliberately NOT in the pattern.
          # Under the gate structure the `pull_request` trigger is
          # unfiltered, so editing this file no longer needs to appear here
          # to prove the workflow still dispatches -- `changes` proves that
          # by running. Listing it would instead make every future CI-config
          # edit, comment changes included, a blocking 40-minute gate once
          # these are required checks. Exercise a workflow edit with the
          # workflow_dispatch button on the branch before merging it.
          if printf '%s\n' "$changed" | grep -qE '^(src/|inst/include/|memcheck/)'; then
            echo "-> compiled code changed; running AddressSanitizer."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no compiled-code change; skipping AddressSanitizer."
            echo "   Coverage for this change arrives on the push to main and in the weekly sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  asan:
    needs: changes
    if: needs.changes.outputs.run == 'true'

    runs-on: ubuntu-24.04

    name: AddressSanitizer ${{ matrix.config.test }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {test: 'tests'}
          - {test: 'examples'}
          - {test: 'vignettes'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      USING_ASAN: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # detect_leaks=0: g++ and make don't free all internal state before exit
      # (by design — the OS reclaims it); LSan would treat that as a failure.
      # CRAN's gcc-ASAN test targets use-after-free / buffer overflows, not leaks.
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=1:verify_asan_link_order=0

    steps:
      - uses: actions/checkout@v6

      - name: Initialize ASan configuration
        run: |
          # Persist LD_PRELOAD so libasan is loaded before R's memory allocator
          # on every subsequent step. Without this, R's allocator claims the
          # address range [0x7fff7000-0x10007fff8000] before libasan can, and
          # ASan aborts with "shadow memory range interleaves with an existing
          # memory mapping". Loading libasan first via LD_PRELOAD lets it
          # reserve the shadow range before any other allocations occur.
          LIBASAN=$(gcc -print-file-name=libasan.so)
          echo "LD_PRELOAD=$LIBASAN" >> "$GITHUB_ENV"

          echo "PKG_CFLAGS = -g -O0 -fsanitize=address -fno-omit-frame-pointer" > src/Makevars
          echo "PKG_CXXFLAGS = -g -O0 -fsanitize=address -fno-omit-frame-pointer" >> src/Makevars

          mkdir ~/.R
          echo "LDFLAGS = -g -O0 -fsanitize=address -fno-omit-frame-pointer" >> ~/.R/Makevars

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "'soft'"
          needs: |
            memcheck

      - name: Install package
        run: |
          # Build from parent dir so the tarball lands outside the source tree;
          # use $GITHUB_WORKSPACE (not a hardcoded package name) because the
          # checkout directory matches the repo name ("r"), not the package name.
          cd "$GITHUB_WORKSPACE/.."
          R CMD build --no-build-vignettes --no-manual --no-resave-data "$GITHUB_WORKSPACE"
          R CMD INSTALL MkPrime*.tar.gz
          cd "$GITHUB_WORKSPACE"

      - name: ASAN - memcheck ${{ matrix.config.test }}
        run: |
          Rscript memcheck/${{ matrix.config.test }}.R

  gate:
    # This is the job branch protection should require.
    #
    # `if: always()` is what makes it report even when `asan` was skipped —
    # without it the gate would itself be skipped and a required check would
    # never arrive. Because always() also runs the job when a dependency
    # failed, the result of each dependency has to be inspected explicitly;
    # GitHub will not fail this job on our behalf.
    name: ASAN gate
    needs: [changes, asan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Certify AddressSanitizer status
        shell: bash
        run: |
          echo "changes : ${{ needs.changes.result }} (run=${{ needs.changes.outputs.run }})"
          echo "asan    : ${{ needs.asan.result }}"

          # A failure to work out whether the sanitiser was needed is not a
          # pass. Fail closed.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection did not succeed, so AddressSanitizer status cannot be certified."
            exit 1
          fi

          case "${{ needs.asan.result }}" in
            success)
              echo "AddressSanitizer passed."
              ;;
            skipped)
              echo "No compiled-code change in this pull request, so AddressSanitizer was not required."
              echo "It still runs on the push to main and in the weekly sweep."
              ;;
            *)
              echo "::error::AddressSanitizer result was '${{ needs.asan.result }}'."
              exit 1
              ;;
          esac
