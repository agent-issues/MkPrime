# Respond to @claude mentions from ms609 on pull request reviews and comments.
#
# Interactive mode: no `prompt` input, so the action waits for the trigger
# phrase rather than running a fixed task. Claude replies in a comment on the
# triggering PR or issue and updates it as it works.
#
# Requires two repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token`; authenticates against the
#                            Max subscription, so runs draw on subscription
#                            usage rather than API billing.
#   CLAUDE_GH_TOKEN          the ms609-agent PAT, so Claude's commits, PRs
#                            and comments are authored by the agent account.
# GitHub Actions minutes are billed separately, whichever token is used.
#
# This file has to be on `main` to do anything: GitHub runs comment- and
# review-triggered workflows from the default branch only, never from the
# branch of the pull request being commented on.
on:
  # Review *bodies* -- the "Request changes" / "Approve" / "Comment" text box
  # -- are a `pull_request_review` event, not a comment event. The upstream
  # starter workflow omits this, so an @claude left in a review summary is
  # silently dropped. It is the primary trigger here.
  pull_request_review:
    types: [submitted]
  # Follow-ups. Fires on plain comments in a PR's conversation as well as on
  # issues, so a course correction does not require submitting a whole new
  # review. Inline review comments (`pull_request_review_comment`) and new
  # issues (`issues`) are deliberately not wired up: the issue queue belongs
  # to /next-issue.
  issue_comment:
    types: [created]

name: Claude

# One Claude run per issue/PR at a time; a second mention queues behind the
# first rather than racing it. Deliberately not cancel-in-progress -- half a
# run can already have pushed commits -- and keyed per PR so that two
# different pull requests still run concurrently.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only ms609 may summon Claude, and the mention must be present.
    #
    # The action's own gate is *write access*, not reviewer status, so being
    # the sole authorised reviewer restricts nothing: ms609-agent holds write
    # too. Its other gate rejects bot actors to stop them looping, and that
    # does not cover ms609-agent either, which is an ordinary user account.
    # Since Claude now posts *as* ms609-agent, and its progress comments
    # quote the request that summoned it -- "@claude" included -- an
    # unbounded self-trigger would otherwise be billed to both the
    # subscription and Actions minutes.
    #
    # Written as an allowlist rather than as `!= 'ms609-agent'` so that
    # adding a collaborator does not silently hand them the trigger.
    #
    # The trigger-phrase half is re-checked by the action itself; testing it
    # here only avoids paying for a runner that would immediately exit.
    if: |
      github.actor == 'ms609' &&
      ((github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
       (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write        # push branches
      pull-requests: write   # open PRs, comment
      issues: write          # comment on issues
      id-token: write        # the action wants this even with our own token
      actions: read          # read CI results on PRs

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Act as ms609-agent, per the repo's identity rule, rather than as
          # the Claude GitHub App. A PAT-authenticated push still triggers
          # R-CMD-check and the sanitisers; the default GITHUB_TOKEN would
          # not, which is why that is never the right value here.
          github_token: ${{ secrets.CLAUDE_GH_TOKEN }}
          claude_args: |
            --max-turns 30
