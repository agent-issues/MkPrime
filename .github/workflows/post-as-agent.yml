# Open an issue or PR, or comment on one, as ms609-agent; or delete a branch.
#
# Exists because cloud Claude Code sessions reach GitHub only through a
# proxy whose credential they cannot choose: items they create land under
# claude[bot] or the maintainer's own account, and the maintainer cannot
# approve a PR he authored. Authorship here comes from the CLAUDE_GH_TOKEN
# secret alone, whoever dispatches the run.
#
# Fails rather than falling back to github.token: an item posted under the
# wrong account cannot be re-attributed.
#
# delete-branch exists because the proxy refuses branch deletes. It runs
# in its own job with github.token (a deletion has no author to attribute),
# and refuses the default branch, protected branches, and the head of any
# open PR.
#
# Must be on `main`: workflow_dispatch runs only workflows on the default
# branch (or the ref it is dispatched against).
name: Post as agent

on:
  workflow_dispatch:
    inputs:
      action:
        description: "issue (open an issue), comment (on an issue or PR), pr (open a PR from a pushed branch), or delete-branch"
        required: true
        type: choice
        options: [issue, comment, pr, delete-branch]
      body:
        description: "Markdown body (issue, comment, pr)"
        required: false
        default: ""
      title:
        description: "Title (issue, pr)"
        required: false
        default: ""
      number:
        description: "Issue or PR number (comment)"
        required: false
        default: ""
      labels:
        description: "Comma-separated labels (issue, pr)"
        required: false
        default: ""
      head:
        description: "Pushed branch to open the PR from (pr)"
        required: false
        default: ""
      base:
        description: "Branch to merge into (pr)"
        required: false
        default: "main"
      draft:
        description: "Open the PR as a draft (pr)"
        required: false
        type: boolean
        default: false
      branch:
        description: "Branch to delete (delete-branch)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  post:
    if: inputs.action != 'delete-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Post
        env:
          # Inputs arrive via env, never interpolated into the script.
          GH_TOKEN: ${{ secrets.CLAUDE_GH_TOKEN }}
          REPO: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          BODY: ${{ inputs.body }}
          TITLE: ${{ inputs.title }}
          NUMBER: ${{ inputs.number }}
          LABELS: ${{ inputs.labels }}
          HEAD: ${{ inputs.head }}
          BASE: ${{ inputs.base }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CLAUDE_GH_TOKEN secret is unset; refusing to post under another account"
            exit 1
          fi

          need() {
            if [ -z "${!1}" ]; then
              echo "::error::'$(tr '[:upper:]' '[:lower:]' <<<"$1")' is required for action '$ACTION'"
              exit 1
            fi
          }

          labelArgs=()
          if [ -n "$LABELS" ]; then
            labelArgs=(--label "$LABELS")
          fi

          case "$ACTION" in
            issue)
              need BODY
              need TITLE
              url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" "${labelArgs[@]}")
              ;;
            comment)
              need BODY
              need NUMBER
              url=$(gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY")
              ;;
            pr)
              need BODY
              need TITLE
              need HEAD
              draftArgs=()
              if [ "$DRAFT" = "true" ]; then
                draftArgs=(--draft)
              fi
              url=$(gh pr create --repo "$REPO" --head "$HEAD" --base "$BASE" \
                --title "$TITLE" --body "$BODY" --reviewer ms609 --assignee ms609 \
                "${draftArgs[@]}" "${labelArgs[@]}")
              ;;
          esac

          echo "Posted: $url"
          echo "Posted: $url" >> "$GITHUB_STEP_SUMMARY"

  delete-branch:
    if: inputs.action == 'delete-branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [ -z "$BRANCH" ]; then
            echo "::error::'branch' is required for action 'delete-branch'"
            exit 1
          fi
          ref=$(jq -rn --arg b "$BRANCH" '$b|@uri|gsub("%2F"; "/")')

          default=$(gh api "repos/$REPO" --jq .default_branch)
          if [ "$BRANCH" = "$default" ]; then
            echo "::error::refusing to delete the default branch '$default'"
            exit 1
          fi
          if [ "$(gh api "repos/$REPO/branches/$ref" --jq .protected)" = "true" ]; then
            echo "::error::refusing to delete protected branch '$BRANCH'"
            exit 1
          fi
          openPrs=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[].url')
          if [ -n "$openPrs" ]; then
            echo "::error::refusing to delete '$BRANCH', head of open PR(s): $openPrs"
            exit 1
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$ref"
          echo "Deleted branch: $BRANCH"
          echo "Deleted branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
