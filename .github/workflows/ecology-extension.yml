# Builds MkPrime from this branch, then the ecology extension against it,
# and runs the extension's tests. The extension lives outside the MkPrime
# package (.Rbuildignore), so R-CMD-check.yml does not see it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "extensions/**"
      - "inst/include/**"
      - "src/**"
      - "R/**"
      - ".github/workflows/ecology-extension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "inst/include/**"

name: ecology-extension

jobs:
  test:
    runs-on: ubuntu-24.04
    name: MkPrimeEcology tests
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: eco-1
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::withr
            any::TreeTools
            any::ape

      - name: Install MkPrime and MkPrimeEcology
        run: |
          R CMD INSTALL .
          R CMD INSTALL extensions/MkPrimeEcology
        shell: bash

      - name: Test MkPrimeEcology
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_dir("extensions/MkPrimeEcology/tests/testthat", package = "MkPrimeEcology", load_package = "installed", stop_on_failure = TRUE)); print(res[, c("test", "nb", "failed", "skipped", "error")])'
        shell: bash
