# Builds MkPrime from this branch, then EcoAware (git submodule at
# extensions/EcoAware, from agent-issues/EcoAware) against it, and runs
# EcoAware's tests. The submodule is outside the MkPrime package
# (.Rbuildignore), so R-CMD-check.yml does not see it.
#
# agent-issues/EcoAware is private and this repository is public, so the
# default GITHUB_TOKEN cannot fetch the submodule. The job uses the secret
# ECOAWARE_READ_TOKEN (preferred: read-only access to agent-issues/EcoAware)
# and otherwise falls back to CLAUDE_GH_TOKEN. Neither reaches pull requests
# from forks, and checkout does not persist the token.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "extensions/**"
      - ".gitmodules"
      - "inst/include/**"
      - "src/**"
      - "R/**"
      - ".github/workflows/ecology-extension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - ".gitmodules"
      - "inst/include/**"

name: ecology-extension

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: EcoAware tests
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
    steps:
      - name: Require the submodule token
        env:
          ECOAWARE_READ_TOKEN: ${{ secrets.ECOAWARE_READ_TOKEN || secrets.CLAUDE_GH_TOKEN }}
        run: |
          if [ -z "$ECOAWARE_READ_TOKEN" ]; then
            echo "::error::Neither ECOAWARE_READ_TOKEN nor CLAUDE_GH_TOKEN is available; one is needed to check out the private agent-issues/EcoAware submodule."
            exit 1
          fi
        shell: bash

      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.ECOAWARE_READ_TOKEN || secrets.CLAUDE_GH_TOKEN }}
          persist-credentials: false

      - name: Report the EcoAware commit under test
        run: git -C extensions/EcoAware log -1 --format='EcoAware %H %s'
        shell: bash

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: eco-1
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::withr
            any::TreeTools
            any::ape

      - name: Install MkPrime and EcoAware
        run: |
          R CMD INSTALL .
          R CMD INSTALL extensions/EcoAware
        shell: bash

      - name: Test EcoAware
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_dir("extensions/EcoAware/tests/testthat", package = "EcoAware", load_package = "installed", stop_on_failure = TRUE)); print(res[, c("test", "nb", "failed", "skipped", "error")])'
        shell: bash
