on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/rchk.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.qmd'
  pull_request:
    paths:
      - '.github/workflows/rchk.yml'
      - 'src/**'
      - 'inst/include/**'
      - 'memcheck/**'
      - 'tests/testthat/**.R'
      - 'vignettes/**.qmd'

name: rchk

jobs:
  rchk:
    runs-on: ubuntu-latest
    container:
      image: rhub/ubuntu-rchk
      options: --user=root
    steps:
    - uses: actions/checkout@v6

    - name: Set up rchk environment
      # Sources cmpconfig.inc to export the LLVM compiler flags rchk needs.
      # The container's default PATH puts /home/docker/R-svn/bin first; that R
      # stub calls exec/R which doesn't exist, so every Rscript step dies with
      # exit 127. We export a sanitised PATH that keeps the LLVM tools but
      # removes the broken R stub, leaving /usr/bin/Rscript as the default R.
      run: |
        # r-base gives a working system Rscript (/usr/bin/Rscript); the
        # container's own R stub (/home/docker/R-svn/bin/R) calls exec/R which
        # is absent, so package installation must use the system R instead.
        apt-get update && apt-get install -y sudo r-base
        cd /home/docker/R-svn/
        . /home/docker/rchk/scripts/cmpconfig.inc

        # Compiler / rchk env vars (safe to export)
        for var in CPICFLAGS CFLAGS CXXFLAGS CC CXX LLVM_COMPILER \
                   PKG_BUILD_DIR R_LIBS R_LIBSONLY LD; do
          echo "$var=${!var}" >> "$GITHUB_ENV"
        done
        echo "R_LIBS_USER=$R_LIBS" >> "$GITHUB_ENV"

        # Rebuild PATH: keep LLVM tools, strip the broken R stub directory.
        SAFE_PATH=$(printf '%s' "$PATH" | tr ':' '\n' \
          | grep -v '/home/docker/R-svn' | tr '\n' ':' | sed 's/:$//')
        echo "PATH=/usr/lib/llvm-12/bin:$SAFE_PATH" >> "$GITHUB_ENV"
      shell: bash

    - name: Patch DESCRIPTION for R 3.6.3
      # The rchk container ships R 3.6.3; relax the version constraint and
      # strip \u{xxxx} Unicode escapes from Rd (added in R 4.2) so R CMD
      # build succeeds. rchk only analyses C++ code, not R-side API usage.
      run: |
        sed -i 's/R (>= 4\.[0-9]*)/R (>= 3.5)/' DESCRIPTION
      shell: bash

    - name: Install R dependencies
      run: |
        install.packages('remotes', repos = 'https://cran.rstudio.com/')
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}

    - name: Install package
      run: remotes::install_local(build = FALSE)
      shell: Rscript {0}

    - name: Run rchk
      run: |
        PKG=$(Rscript -e "d=read.dcf('DESCRIPTION'); cat(d[, 'Package'])")
        cd /home/docker/R-svn/
        /home/docker/rchk/scripts/check_package.sh "$PKG"
        FAIL=0
        bcheck="packages/lib/$PKG/libs/$PKG.so.bcheck"
        maacheck="packages/lib/$PKG/libs/$PKG.so.maacheck"
        [ "$(wc -l < "$bcheck")"    -gt 3 ] && FAIL=1
        [ "$(wc -l < "$maacheck")" -gt 3 ] && FAIL=1
        cat "$maacheck"
        cat "$bcheck"
        [ "$FAIL" = 1 ] && { echo "rchk tests failed."; exit 1; }
        echo "rchk tests succeeded."
      shell: bash
