# valgrind memcheck.
#
# Structure mirrors ASan.yml: `changes` decides whether this PR touches
# compiled code; `valgrind` runs only if it does; `gate` always runs and
# reports the single status that branch protection requires. A PR with no
# C++ change skips the matrix and the gate passes immediately, so the
# required check can never deadlock on a workflow that did not trigger.
#
# For help debugging build failures open an issue on the RStudio community
# with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  # workflow_dispatch was absent until 2026-09-19: mem-check could not be
  # launched by hand at all.
  workflow_dispatch:
  schedule:
    # Weekly full sweep — see the note in ASan.yml. Offset from gcc-ASAN
    # (Sun 03:00) and R-CMD-check (Thu 04:00).
    - cron: '0 6 * * 0'  # Sundays, 6am
  push:
    branches:
      - main
      - master
      - '**valgrind**'
  # Deliberately unfiltered — see ASan.yml. Path filtering happens in
  # `changes`, where a skip still reports a status.
  pull_request:
    branches:
      - main
      - master

name: mem-check

jobs:
  changes:
    name: detect compiled-code changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} -> running valgrind."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true

          # Three dots: diff against the MERGE BASE, not the tip of the
          # base branch. Two dots would attribute every change made on
          # main since this branch forked to this pull request, firing
          # the sanitiser on PRs that touch no compiled code at all.
          changed=$(git diff --name-only "$base...$head")
          echo "Changed files:"
          printf '  %s\n' $changed

          # This workflow's own file is deliberately NOT in the pattern.
          # Under the gate structure the `pull_request` trigger is
          # unfiltered, so editing this file no longer needs to appear here
          # to prove the workflow still dispatches -- `changes` proves that
          # by running. Listing it would instead make every future CI-config
          # edit, comment changes included, a blocking 40-minute gate once
          # these are required checks. Exercise a workflow edit with the
          # workflow_dispatch button on the branch before merging it.
          if printf '%s\n' "$changed" | grep -qE '^(src/|inst/include/|memcheck/)'; then
            echo "-> compiled code changed; running valgrind."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no compiled-code change; skipping valgrind."
            echo "   Coverage for this change arrives on the push to main and in the weekly sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  valgrind:
    needs: changes
    if: needs.changes.outputs.run == 'true'

    runs-on: ubuntu-24.04

    name: valgrind ${{ matrix.config.test }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {test: 'tests'}
          - {test: 'examples'}
          - {test: 'vignettes'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ASAN_OPTIONS: verify_asan_link_order=0
      # Skips long MCMC integration blocks whose C++ paths cheaper tests already
      # reach: valgrind costs ~30x gcc-ASAN, so the full suite needs ~18 h
      # against GitHub's 6 h job ceiling. See tests/testthat/helper-slow.R.
      MKPRIME_MEMCHECK: true

    steps:
      - uses: ms609/actions/memcheck@main
        with:
          test: ${{ matrix.config.test}}

  gate:
    # This is the job branch protection should require.
    #
    # `if: always()` is what makes it report even when `valgrind` was
    # skipped. Because always() also runs the job when a dependency failed,
    # each dependency's result must be inspected explicitly; GitHub will not
    # fail this job on our behalf.
    name: valgrind gate
    needs: [changes, valgrind]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Certify valgrind status
        shell: bash
        run: |
          echo "changes  : ${{ needs.changes.result }} (run=${{ needs.changes.outputs.run }})"
          echo "valgrind : ${{ needs.valgrind.result }}"

          # Failing to determine whether the sanitiser was needed is not a
          # pass. Fail closed.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection did not succeed, so valgrind status cannot be certified."
            exit 1
          fi

          case "${{ needs.valgrind.result }}" in
            success)
              echo "valgrind passed."
              ;;
            skipped)
              echo "No compiled-code change in this pull request, so valgrind was not required."
              echo "It still runs on the push to main and in the weekly sweep."
              ;;
            *)
              echo "::error::valgrind result was '${{ needs.valgrind.result }}'."
              exit 1
              ;;
          esac
