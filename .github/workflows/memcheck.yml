# valgrind memcheck.
#
# On pull requests R-CMD-check.yml calls this workflow, and only once its
# sense-check has passed; the required `valgrind gate` lives there too.
# `changes` decides whether this PR touches compiled code; `valgrind` runs
# only if it does.
#
# Pull requests run a *smoke* test suite: every test file except the MCMC
# integration files in PR_SKIP (~170 min of valgrind time, ~60 min wall clock
# once spread across parallel jobs). Pushes to main, the weekly sweep and
# workflow_dispatch run the full suite (~520 min, ~2 h wall clock); a failure
# there opens (or comments on) one issue. To run the full suite on a PR branch
# before merging, dispatch this workflow on that branch; tick `smoke` to run
# the PR smoke set instead.
#
# `tests` is a matrix of groups of test files, balanced by the per-file times
# in .github/memcheck-times.tsv (unlisted files, e.g. new ones, assume 120 s).
# A new test file needs no workflow edit; refresh the table when a file's
# cost changes much (`| name [Ns]` lines of a full job log).
#
# For help debugging build failures open an issue on the RStudio community
# with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  # workflow_dispatch was absent until 2026-09-19: mem-check could not be
  # launched by hand at all.
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the pull-request smoke set instead of the full suite
        type: boolean
        default: false
  schedule:
    # Weekly full sweep — see the note in ASan.yml. Offset from gcc-ASAN
    # (Sun 03:00) and R-CMD-check (Thu 04:00).
    - cron: '0 6 * * 0'  # Sundays, 6am
  push:
    branches:
      - main
      - master
      # No '**valgrind**' branch pattern: such a branch's push would run the
      # ~3.5 h full suite beside its PR's smoke run. Dispatch on the branch
      # instead.
  # Pull requests: called from R-CMD-check.yml, behind its sense-check.
  workflow_call:

name: mem-check

env:
  # Test files skipped on pull requests. Each costs over a minute under
  # valgrind and drives the C++ through MCMC runs rather than unit calls;
  # together they are ~150 of the full suite's ~200 min (2026-09-21).
  # C++ unit files stay in, however slow. Add a file here only on the
  # same grounds; the full suite still runs it after merge.
  #
  # The two pi-invariance gates are the extreme case: 5 s and 25 s of
  # wall clock locally, 35 min and 14 min under valgrind -- together half
  # the smoke budget, for statistical properties of kernels whose C++ the
  # cheaper weighted-spr / subtree-swap files already execute.
  PR_SKIP: >-
    ^(marginal-k-free-topology|node-cl-cache|stepping-stone|stepping-stone-schedule|partition-moves-impl|partition-casali-smoke|auto-thin|tree-thin|beta-geometric-prior|marginal-k-truncation|weighted-spr-invariance|gibbs-subtree-swap-invariance)$

jobs:
  changes:
    name: detect compiled-code changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      smoke: ${{ github.event_name == 'pull_request' || inputs.smoke == true }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} -> running valgrind."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true

          # Three dots: diff against the MERGE BASE, not the tip of the
          # base branch. Two dots would attribute every change made on
          # main since this branch forked to this pull request, firing
          # the sanitiser on PRs that touch no compiled code at all.
          changed=$(git diff --name-only "$base...$head")
          echo "Changed files:"
          printf '  %s\n' $changed

          # The gate's own files are in the pattern so that editing the gate
          # exercises it on the PR.
          if printf '%s\n' "$changed" | grep -qE '^(src/|inst/include/|memcheck/|\.github/workflows/(memcheck|R-CMD-check)\.yml$|\.github/memcheck-times\.tsv$)'; then
            echo "-> compiled code changed; running valgrind."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no compiled-code change; skipping valgrind."
            echo "   Coverage for this change arrives on the push to main and in the weekly sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - id: matrix
        shell: bash
        env:
          SMOKE: ${{ github.event_name == 'pull_request' || inputs.smoke == true }}
        run: |
          set -euo pipefail
          tests=$(python3 - <<'PY'
          import json, math, os, pathlib, re
          smoke = os.environ["SMOKE"] == "true"
          skip = re.compile(os.environ["PR_SKIP"]) if smoke else None
          times = {}
          for line in open(".github/memcheck-times.tsv"):
              if line.strip() and not line.startswith("#"):
                  name, sec = line.split()
                  times[name] = float(sec)
          names = sorted(p.name[5:-2] for p in pathlib.Path("tests/testthat").glob("test-*.R"))
          names = [n for n in names if not (skip and skip.search(n))]
          cost = {n: times.get(n, 120.0) for n in names}
          # Groups of ~target minutes of valgrind time; a file longer than
          # that gets a group to itself, so the slowest file sets the wall clock.
          target = 30 * 60 if smoke else 60 * 60
          n = max(1, math.ceil(sum(cost.values()) / target))
          bins = [[0.0, []] for _ in range(n)]
          for name in sorted(names, key=lambda x: -cost[x]):
              b = min(bins, key=lambda x: x[0])
              b[0] += cost[name]
              b[1].append(name)
          bins = [b for b in bins if b[1]]
          out = []
          for k, (load, group) in enumerate(bins, 1):
              flt = "^(" + "|".join(g.replace(".", "\\.") for g in sorted(group)) + ")$"
              out.append({"test": "tests", "shard": f"{k}/{len(bins)}",
                          "filter": flt, "invert": "false"})
          print(json.dumps(out))
          PY
          )
          matrix=$(jq -nc --argjson t "$tests" \
            '{config: ($t + [{test: "examples"}, {test: "vignettes"}])}')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  valgrind:
    needs: changes
    if: needs.changes.outputs.run == 'true'

    runs-on: ubuntu-24.04

    name: valgrind ${{ matrix.config.test }}${{ matrix.config.shard && format(' {0}', matrix.config.shard) || '' }}

    # A hang names its group. The slowest file takes ~56 min on a typical
    # runner and runs up to ~1.4x slower on a bad one (#249, #308), so a
    # smoke group needs 90 min; full-suite groups hold the 100+ min files.
    timeout-minutes: ${{ needs.changes.outputs.smoke == 'true' && 90 || 240 }}

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      RSPM: https://packagemanager.rstudio.com/cran/__linux__/noble/latest
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ASAN_OPTIONS: verify_asan_link_order=0
      # Skips long MCMC integration blocks whose C++ paths cheaper tests already
      # reach: valgrind costs ~30x gcc-ASAN, so the full suite needs ~18 h
      # against GitHub's 6 h job ceiling. See tests/testthat/helper-slow.R.
      MKPRIME_MEMCHECK: true

    steps:
      - uses: ms609/actions/memcheck@main
        with:
          test: ${{ matrix.config.test}}
          filter: ${{ matrix.config.filter || '' }}
          invert: ${{ matrix.config.invert || 'false' }}

  report:
    # A full-suite failure after merge blocks nothing, so make it visible:
    # open an issue, or comment on the one already open.
    name: report full-suite failure
    needs: [changes, valgrind]
    # A timeout reports as 'cancelled', not 'failure', so test both. Only
    # main: a full run dispatched on a PR branch, or cancelled there by hand,
    # is not news.
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["failure", "cancelled"]'), needs.valgrind.result)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "valgrind: full suite failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="The full valgrind suite failed or timed out on main @ ${GITHUB_SHA::7} (${{ github.event_name }}): $RUN_URL"
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
