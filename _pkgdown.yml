url: https://mk-prime.github.io/r/

home:
  title: MkPrime
  description: >
    Bayesian phylogenetic inference from discrete morphological characters
    under the Mk' model, which infers the true number of character states
    including those not observed in the data.

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/mk-prime/r
      aria-label: GitHub

articles:
  - title: Getting started
    navbar: ~
    contents:
      - hyoliths
  - title: Technical details
    navbar: ~
    contents:
      - het-details

reference:
  - title: Model setup
    desc: Prepare data, specify the model and priors, and configure MCMC.
    contents:
      - has_concept("mkp_setup")

  - title: Running an analysis
    desc: Run, resume and configure console output, or use the Shiny interface.
    contents:
      - has_concept("mkp_run")

  - title: Convergence and model comparison
    desc: Assess convergence, set burn-in, and estimate marginal likelihoods.
    contents:
      - has_concept("mkp_diagnostics")
      - print.MkpDiagnostics

  - title: Posterior samples and logs
    desc: Read, recover and inspect streamed MCMC output.
    contents:
      - has_concept("mkp_posterior")

  - title: Progress visualization
    desc: Callbacks for monitoring a running MCMC.
    contents:
      - has_concept("mkp_progress")
